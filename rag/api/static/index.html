<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Chat</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e3e1d9;
    --accent: #1f6f5c; --accent-ink: #ffffff; --user: #e8f1ee; --warn: #b45309; --err: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131413; --panel: #1b1c1a; --ink: #ecebe6; --muted: #9a998f; --line: #2c2d2a;
            --accent: #4fb89d; --accent-ink: #0d1f1a; --user: #20332d; --warn: #f0a04b; --err: #f97066; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--ink);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  aside { width: 300px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
          display: flex; flex-direction: column; padding: 16px; gap: 14px; overflow-y: auto; }
  h1 { font-size: 16px; margin: 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
  .status { font-size: 12px; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--err); margin-right: 6px; }
  .dot.ok { background: var(--accent); }
  .drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 18px 12px; text-align: center;
          color: var(--muted); cursor: pointer; font-size: 13px; }
  .drop.over, .drop:hover { border-color: var(--accent); color: var(--ink); }
  .doc { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .doc span.name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc small { color: var(--muted); }
  .x { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; padding: 0 4px; }
  .x:hover { color: var(--err); }
  .job { font-size: 12px; color: var(--muted); padding: 2px 0; }
  .job.fail { color: var(--err); }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 360px; }
  .msg { max-width: 760px; width: 100%; margin: 0 auto; }
  .bubble { padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user .bubble { background: var(--user); margin-left: auto; width: fit-content; max-width: 85%; }
  .msg.bot .bubble { background: var(--panel); border: 1px solid var(--line); }
  .msg.err .bubble { border-color: var(--err); color: var(--err); }
  .cite { display: inline-block; background: var(--accent); color: var(--accent-ink); border-radius: 4px;
          font-size: 11px; padding: 0 5px; margin: 0 1px; vertical-align: 1px; }
  .sources { margin-top: 8px; font-size: 13px; }
  .sources summary { cursor: pointer; color: var(--muted); }
  .src { margin: 6px 0 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--panel);
         border-radius: 0 8px 8px 0; }
  .src b { font-weight: 600; }
  .src p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; white-space: pre-wrap; }
  form { padding: 14px 20px 20px; max-width: 800px; width: 100%; margin: 0 auto; display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
             background: var(--panel); color: var(--ink); font: inherit; max-height: 160px; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.send { border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink);
                padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer; }
  button.send:disabled { opacity: .5; cursor: default; }
  .link { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; padding: 0; text-align: left; }
  .link:hover { color: var(--ink); }
  @media (max-width: 760px) { body { flex-direction: column; } aside { width: 100%; max-height: 38vh; border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<aside>
  <div>
    <h1>RAG Chat</h1>
    <div class="status"><span id="dot" class="dot"></span><span id="status">connecting…</span></div>
  </div>
  <div>
    <h2>Add documents</h2>
    <div class="drop" id="drop">Drop files here or click<br><small>pdf · docx · txt · md</small></div>
    <input type="file" id="file" multiple hidden accept=".pdf,.docx,.txt,.md">
    <div id="jobs"></div>
  </div>
  <div>
    <h2>Indexed documents</h2>
    <div id="docs"><div class="job">none yet</div></div>
  </div>
  <button class="link" id="clear">Clear conversation</button>
</aside>
<main>
  <div id="log"><div class="empty" id="empty"><b>Ask about your documents</b><br>Upload a file on the left, then ask a question. Answers cite their sources.</div></div>
  <form id="form">
    <textarea id="q" rows="1" placeholder="Ask a question…" autofocus></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </form>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let history = [], busy = false;

async function refreshHealth() {
  try {
    const h = await (await fetch('/healthz')).json();
    $('dot').className = 'dot' + (h.llm_configured ? ' ok' : '');
    $('status').textContent = h.llm_configured
      ? `${h.llm_provider} · ${h.chunks} chunks indexed`
      : 'no LLM configured — set GROQ_API_KEY in .env';
  } catch { $('dot').className = 'dot'; $('status').textContent = 'server unreachable'; }
}

async function refreshDocs() {
  const docs = await (await fetch('/documents')).json();
  $('docs').innerHTML = docs.length ? '' : '<div class="job">none yet</div>';
  for (const d of docs) {
    const row = document.createElement('div'); row.className = 'doc';
    row.innerHTML = `<span class="name" title="${esc(d.title)}">${esc(d.title)}</span><small>${d.chunk_count}</small><button class="x" title="Remove">×</button>`;
    row.querySelector('button').onclick = async () => {
      await fetch('/documents/' + d.source_id, { method: 'DELETE' }); refreshDocs(); refreshHealth();
    };
    $('docs').appendChild(row);
  }
}

async function upload(files) {
  for (const f of files) {
    const line = document.createElement('div'); line.className = 'job'; line.textContent = `${f.name}: uploading…`;
    $('jobs').appendChild(line);
    const fd = new FormData(); fd.append('file', f);
    const r = await fetch('/ingest', { method: 'POST', body: fd });
    if (!r.ok) { line.className = 'job fail'; line.textContent = `${f.name}: ${(await r.json()).detail || r.status}`; continue; }
    const { job_id } = await r.json();
    while (true) {
      await new Promise(r => setTimeout(r, 800));
      const j = await (await fetch('/jobs/' + job_id)).json();
      if (j.status === 'done') { line.textContent = `${f.name}: ✓ ${j.detail}`; break; }
      if (j.status === 'failed') { line.className = 'job fail'; line.textContent = `${f.name}: failed — ${j.detail.split('\n')[0]}`; break; }
      line.textContent = `${f.name}: ${j.detail || j.status}…`;
    }
    refreshDocs(); refreshHealth();
  }
}

const drop = $('drop');
drop.onclick = () => $('file').click();
$('file').onchange = e => { upload([...e.target.files]); e.target.value = ''; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); upload([...e.dataTransfer.files]); };

function addMsg(kind, text = '') {
  $('empty')?.remove();
  const m = document.createElement('div'); m.className = 'msg ' + kind;
  m.innerHTML = '<div class="bubble"></div>';
  $('log').appendChild(m); setText(m, text); $('log').scrollTop = 1e9;
  return m;
}
const setText = (m, t) => { m.querySelector('.bubble').innerHTML = esc(t).replace(/\[(\d+)\]/g, '<span class="cite">$1</span>'); };

function addSources(m, cites) {
  if (!cites.length) return;
  const d = document.createElement('details'); d.className = 'sources';
  d.innerHTML = `<summary>${cites.length} source${cites.length > 1 ? 's' : ''}</summary>` + cites.map(c =>
    `<div class="src"><b><span class="cite">${c.n}</span> ${esc(c.title)}${c.page ? ', p.' + c.page : ''}</b>
     <small> · ${c.inferred ? 'closest match (not cited by the model)' : 'score ' + c.score}</small><p>${esc(c.snippet)}…</p></div>`).join('');
  m.appendChild(d);
}

async function ask(question) {
  busy = true; $('send').disabled = true;
  addMsg('user', question);
  const bot = addMsg('bot', '…');
  let answer = '';
  try {
    const r = await fetch('/chat/stream', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, chat_history: history.slice(-6) }) });
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const p of parts) {
        const ev = (p.match(/^event: (.*)$/m) || [])[1], data = (p.match(/^data: (.*)$/m) || [])[1];
        if (!ev || data === undefined) continue;
        const val = JSON.parse(data);
        if (ev === 'token') { answer += val; setText(bot, answer); $('log').scrollTop = 1e9; }
        else if (ev === 'citations') addSources(bot, val);
        else if (ev === 'error') { bot.classList.add('err'); setText(bot, answer + '\n\nError: ' + val); }
      }
    }
    history.push({ role: 'user', content: question }, { role: 'assistant', content: answer });
  } catch (e) { bot.classList.add('err'); setText(bot, 'Error: ' + e.message); }
  busy = false; $('send').disabled = false; $('q').focus();
}

$('form').onsubmit = e => {
  e.preventDefault(); const q = $('q').value.trim(); if (!q || busy) return;
  $('q').value = ''; $('q').style.height = 'auto'; ask(q);
};
$('q').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); } };
$('q').oninput = e => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; };
$('clear').onclick = () => { history = []; $('log').innerHTML = '<div class="empty" id="empty"><b>Ask about your documents</b><br>Conversation cleared.</div>'; };

refreshHealth(); refreshDocs();
</script>
</body>
</html>
